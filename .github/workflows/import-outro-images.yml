name: Import outro images from Higgsfield

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - download_outro.py
      - .github/workflows/import-outro-images.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download images into images/outro
        run: python3 download_outro.py images/outro
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images/outro
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            git commit -m "Import Higgsfield outro images into images/outro"
            git push
          fi
